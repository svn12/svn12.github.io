<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鋼琴基本和弦初學者練習庫 Piano Chord Trainer</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --white-key-bg: #ffffff;
      --black-key-bg: #1e293b;
      --root-note-bg: #ef4444;
      --chord-note-bg: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Tab Navigation */
    .tabs {
      display: flex;
      gap: 8px;
      background: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--card-border);
    }

    .tab-btn {
      padding: 8px 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .tab-btn:hover:not(.active) {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Layout Containers */
    .main-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Controls Group */
    .selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip-btn {
      flex: 1;
      min-width: 44px;
      padding: 8px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .chip-btn:hover:not(.active) {
      border-color: var(--primary);
      color: #ffffff;
    }

    select.custom-select {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    select.custom-select:focus {
      border-color: var(--primary);
    }

    /* Chord Info Display */
    .chord-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chord-title-box h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
    }

    .chord-title-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .chord-notes-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .note-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
    }

    .note-badge.is-root {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.15);
    }

    .note-badge .n-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .note-badge .n-role {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .action-btns {
      display: flex;
      gap: 10px;
    }

    .btn-play {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-play:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-play.sec {
      background: #334155;
    }
    .btn-play.sec:hover {
      background: #475569;
    }

    /* Piano Container */
    .piano-wrapper {
      position: relative;
      width: 100%;
      overflow-x: auto;
      padding: 10px 0 20px 0;
      display: flex;
      justify-content: center;
    }

    .piano-keyboard {
      position: relative;
      display: flex;
      height: 200px;
      background: #000;
      padding: 4px;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      border-top: 8px solid #991b1b;
    }

    .key {
      position: relative;
      cursor: pointer;
      border-radius: 0 0 5px 5px;
      transition: background-color 0.1s, transform 0.05s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .key.white {
      width: 40px;
      height: 100%;
      background: var(--white-key-bg);
      color: #475569;
      border: 1px solid #cbd5e1;
      border-top: none;
      z-index: 1;
      margin: 0 1px;
    }

    .key.white:active, .key.white.pressed {
      background: #e2e8f0;
      transform: translateY(2px);
    }

    .key.black {
      width: 26px;
      height: 60%;
      background: var(--black-key-bg);
      color: #94a3b8;
      border: 1px solid #0f172a;
      z-index: 2;
      margin-left: -14px;
      margin-right: -14px;
      border-radius: 0 0 4px 4px;
      box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
    }

    .key.black:active, .key.black.pressed {
      background: #090d16;
      transform: translateY(2px);
    }

    /* Active Highlight States */
    .key.highlight-root {
      background: #ef4444 !important;
      color: #ffffff !important;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4), 0 0 15px rgba(239, 68, 68, 0.6);
    }

    .key.highlight-chord {
      background: #3b82f6 !important;
      color: #ffffff !important;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4), 0 0 15px rgba(59, 130, 246, 0.6);
    }

    .key.highlight-user {
      background: #f59e0b !important;
      color: #ffffff !important;
    }

    .key .finger-badge {
      position: absolute;
      top: 6px;
      width: 20px;
      height: 20px;
      background: #f59e0b;
      color: #0f172a;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .key .key-label {
      pointer-events: none;
    }

    /* Quiz Panel Styling */
    .quiz-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      padding: 10px 0;
    }

    .quiz-target {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(245, 158, 11, 0.1);
      padding: 12px 32px;
      border-radius: 12px;
      border: 1px dashed var(--accent);
    }

    .quiz-stats {
      display: flex;
      gap: 24px;
      font-size: 1rem;
      color: var(--text-muted);
    }

    .quiz-stats span strong {
      color: #ffffff;
      font-size: 1.2rem;
    }

    .feedback-msg {
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 28px;
    }
    .feedback-msg.correct { color: var(--success); }
    .feedback-msg.wrong { color: var(--danger); }

    /* Progression List */
    .prog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .prog-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .prog-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .prog-card h3 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .prog-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .prog-chords {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prog-chord-tag {
      padding: 4px 10px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }

    /* Legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    @media (max-width: 640px) {
      .key.white { width: 30px; font-size: 0.65rem; }
      .key.black { width: 20px; margin-left: -10px; margin-right: -10px; }
      .chord-title-box h2 { font-size: 1.5rem; }
      .tab-btn { padding: 6px 12px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <header style="position: relative; width: 100%; max-width: 960px;">
    <h1>🎹 鋼琴基本和弦練習庫</h1>
    <p>初學者專用：圖解視覺化、即時琴音、轉位示範與互動跟彈測驗</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('library', event)">📖 和弦圖鑑字典</button>
    <button class="tab-btn" onclick="switchTab('quiz', event)">🎯 彈奏聽音測驗</button>
    <button class="tab-btn" onclick="switchTab('progression', event)">🎵 流行經典和弦進行</button>
  </div>

  <div class="main-container">
    
    <!-- Tab 1: Library Visualizer -->
    <div id="tab-library" class="panel">
      <div class="selector-grid">
        <!-- Root Note Selector -->
        <div class="control-group">
          <label>根音 (Root Note)</label>
          <div class="btn-group" id="root-selector"></div>
        </div>

        <!-- Chord Type Selector -->
        <div class="control-group">
          <label>和弦類型 (Chord Quality)</label>
          <select id="chord-type-select" class="custom-select" onchange="updateChord(true)"></select>
        </div>

        <!-- Inversion Selector -->
        <div class="control-group">
          <label>轉位 (Inversion)</label>
          <div class="btn-group" id="inversion-selector">
            <button class="chip-btn active" onclick="setInversion(0)">原位</button>
            <button class="chip-btn" onclick="setInversion(1)">第一轉位</button>
            <button class="chip-btn" onclick="setInversion(2)">第二轉位</button>
          </div>
        </div>
      </div>

      <!-- Info Box -->
      <div class="chord-display">
        <div class="chord-title-box">
          <h2 id="chord-name-text">C Major</h2>
          <p id="chord-formula-text">大三和弦 (1 - 3 - 5)｜聲響明亮清亮</p>
        </div>

        <div class="chord-notes-badges" id="notes-badges"></div>

        <div class="control-group">
          <label style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted);">播放模式 (Option)</label>
          <div class="action-btns">
            <button class="chip-btn active" id="mode-btn-chord" onclick="setPlayMode('chord')">▶ 齊奏模式</button>
            <button class="chip-btn" id="mode-btn-arpeggio" onclick="setPlayMode('arpeggio')">🎶 琶音模式</button>
          </div>
        </div>
      </div>

      <!-- Keyboard View -->
      <div class="piano-wrapper">
        <div class="piano-keyboard" id="piano-keys"></div>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background:#ef4444"></div>
          <span>根音 (Root)</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#3b82f6"></div>
          <span>和弦音 (Chord Note)</span>
        </div>
      </div>
    </div>

    <!-- Tab 2: Quiz Mode -->
    <div id="tab-quiz" class="panel" style="display: none;">
      <div class="quiz-card">
        <h2>🎯 鋼琴和弦跟彈大考驗</h2>
        <p style="color: var(--text-muted);">請在下方鋼琴鍵盤上按下該和弦包含的所有琴音！</p>
        
        <div class="quiz-target" id="quiz-target-chord">C Major</div>

        <div class="quiz-stats">
          <span>得分：<strong id="quiz-score">0</strong></span>
          <span>連續答對：<strong id="quiz-streak" style="color:var(--accent);">0</strong></span>
        </div>

        <div class="feedback-msg" id="quiz-feedback">點擊琴鍵選取音符，完成後自動判定！</div>

        <div class="action-btns" style="margin-top: 10px;">
          <button class="btn-play" onclick="playQuizTargetChord()">🔊 聽和弦聲音</button>
          <button class="btn-play sec" onclick="checkQuizAnswer()">✅ 送出答案</button>
          <button class="btn-play sec" onclick="nextQuizQuestion()">⏭ 換下一題</button>
        </div>
      </div>

      <!-- Piano Keyboard for Quiz -->
      <div class="piano-wrapper">
        <div class="piano-keyboard" id="quiz-piano-keys"></div>
      </div>
    </div>

    <!-- Tab 3: Progression Practice -->
    <div id="tab-progression" class="panel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
        <div>
          <h2 style="margin-bottom: 4px;">🎵 初學者必學經典和弦進行</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">點擊進行卡片即可試聽，下方將在畫面上同步預覽琴鍵指法與轉接！</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="chip-btn active" id="btn-toggle-loop" onclick="toggleProgLoop()" style="padding: 8px 16px; border-radius: 8px;">🔁 循環重複播放：開啟</button>
          <button class="chip-btn" onclick="clearProgressionHighlights()" style="padding: 8px 16px; border-radius: 8px; background: #334155;">⏹ 停止播放</button>
        </div>
      </div>

      <div class="prog-grid" id="progression-list"></div>

      <!-- 即時指法與鍵盤預覽區 -->
      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px dashed var(--card-border);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
          <h3 style="font-size: 1.2rem; color: var(--accent);" id="prog-current-title">🎹 即時指法與琴鍵預覽</h3>
          <div style="font-size: 0.9rem; color: var(--text-muted);" id="prog-finger-info">建議指法：右手 1-3-5 (拇指-中指-小指)</div>
        </div>

        <div class="piano-wrapper">
          <div class="piano-keyboard" id="prog-piano-keys"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- Web Audio Synth Engine ---
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function playTone(midi, startTime = 0, duration = 1.5) {
      const ctx = getAudioContext();
      const now = startTime || ctx.currentTime;
      const freq = midiToFreq(midi);

      // Fundamental Oscillator
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);

      // Sub harmonic for rich acoustic warmth
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 2, now);

      // Envelope: Piano hit attack & decay
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.4, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      gain2.gain.setValueAtTime(0, now);
      gain2.gain.linearRampToValueAtTime(0.15, now + 0.015);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.8);

      osc.connect(gain);
      osc2.connect(gain2);
      gain.connect(ctx.destination);
      gain2.connect(ctx.destination);

      osc.start(now);
      osc2.start(now);
      osc.stop(now + duration);
      osc2.stop(now + duration);
    }

    // --- Music Theory Definitions ---
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    const CHORD_TYPES = {
      'maj': { name: '大三和弦 (Major)', intervals: [0, 4, 7], roles: ['根音', '大3音', '純5音'], formula: '1 - 3 - 5', desc: '色彩明亮、歡樂、堅定，流行樂最基本核心' },
      'm': { name: '小三和弦 (Minor)', intervals: [0, 3, 7], roles: ['根音', '小3音', '純5音'], formula: '1 - ♭3 - 5', desc: '色彩憂傷、柔和、深沉，常用於抒情樂曲' },
      '7': { name: '屬七和弦 (Dominant 7th)', intervals: [0, 4, 7, 10], roles: ['根音', '大3音', '純5音', '小7音'], formula: '1 - 3 - 5 - ♭7', desc: '帶有強烈傾向解決感與藍調味的七和弦' },
      'maj7': { name: '大七和弦 (Major 7th)', intervals: [0, 4, 7, 11], roles: ['根音', '大3音', '純5音', '大7音'], formula: '1 - 3 - 5 - 7', desc: '典雅、浪漫、爵士與都市流行感十足' },
      'm7': { name: '小七和弦 (Minor 7th)', intervals: [0, 3, 7, 10], roles: ['根音', '小3音', '純5音', '小7音'], formula: '1 - ♭3 - 5 - ♭7', desc: '柔和舒適、質感豐富，R&B與爵士常用' },
      'sus4': { name: '掛留四和弦 (Sus4)', intervals: [0, 5, 7], roles: ['根音', '純4音', '純5音'], formula: '1 - 4 - 5', desc: '懸空感強，常在接回大三和弦前作裝飾' },
      'sus2': { name: '掛留二和弦 (Sus2)', intervals: [0, 2, 7], roles: ['根音', '大2音', '純5音'], formula: '1 - 2 - 5', desc: '通透空靈感，吉他與鋼琴極常見裝飾和弦' },
      'dim': { name: '減三和弦 (Diminished)', intervals: [0, 3, 6], roles: ['根音', '小3音', '減5音'], formula: '1 - ♭3 - ♭5', desc: '緊張、不穩定、帶有懸疑與過渡氣氛' },
      'aug': { name: '增三和弦 (Augmented)', intervals: [0, 4, 8], roles: ['根音', '大3音', '增5音'], formula: '1 - 3 - ♯5', desc: '科幻擴張感，常做為和弦轉接過渡音' }
    };

    // State Variables
    let currentRoot = 'C';
    let currentQuality = 'maj';
    let currentInversion = 0;
    let currentPlayMode = 'chord'; // 'chord' 或 'arpeggio'
    let userSelectedKeys = new Set(); // For Quiz Mode

    function setPlayMode(mode) {
      currentPlayMode = mode;
      document.getElementById('mode-btn-chord').classList.toggle('active', mode === 'chord');
      document.getElementById('mode-btn-arpeggio').classList.toggle('active', mode === 'arpeggio');
      autoPlayCurrentChord();
    }

    function autoPlayCurrentChord() {
      if (currentPlayMode === 'arpeggio') {
        playArpeggio();
      } else {
        playCurrentChord();
      }
    }

    // --- Init Function ---
    window.addEventListener('DOMContentLoaded', () => {
      initRootSelector();
      initChordSelect();
      renderPiano('piano-keys', false);
      renderPiano('quiz-piano-keys', true);
      renderPiano('prog-piano-keys', false);
      updateChord(false); // 頁面初始化不發聲
      initProgressions();
      nextQuizQuestion();
    });

    function initRootSelector() {
      const container = document.getElementById('root-selector');
      container.innerHTML = '';
      NOTE_NAMES.forEach(note => {
        const btn = document.createElement('button');
        btn.className = `chip-btn ${note === currentRoot ? 'active' : ''}`;
        btn.innerText = note;
        btn.onclick = () => {
          currentRoot = note;
          document.querySelectorAll('#root-selector .chip-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          updateChord(true); // 點擊直接播放彈奏
        };
        container.appendChild(btn);
      });
    }

    function initChordSelect() {
      const select = document.getElementById('chord-type-select');
      select.innerHTML = '';
      for (let key in CHORD_TYPES) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = CHORD_TYPES[key].name;
        select.appendChild(opt);
      }
    }

    function setInversion(inv) {
      currentInversion = inv;
      const btns = document.querySelectorAll('#inversion-selector .chip-btn');
      btns.forEach((b, idx) => {
        if (idx === inv) b.classList.add('active');
        else b.classList.remove('active');
      });
      updateChord(true); // 點擊直接播放彈奏
    }

    // Calculate MIDI notes for given root, chord quality and inversion
    function getChordMidiNotes(rootName, qualityKey, inversion = 0, baseOctave = 4) {
      const rootIndex = NOTE_NAMES.indexOf(rootName);
      const rootMidi = 12 * (baseOctave + 1) + rootIndex;
      const intervals = [...CHORD_TYPES[qualityKey].intervals];

      let midiNotes = intervals.map(inv => rootMidi + inv);

      // Apply Inversion
      for (let i = 0; i < inversion; i++) {
        if (midiNotes.length > i) {
          midiNotes[i] += 12; // Move lowest note up an octave
        }
      }
      midiNotes.sort((a, b) => a - b);
      return { rootMidi, midiNotes, roles: CHORD_TYPES[qualityKey].roles };
    }

    function updateChord(shouldPlay = false) {
      currentQuality = document.getElementById('chord-type-select').value;
      const info = CHORD_TYPES[currentQuality];
      const { rootMidi, midiNotes, roles } = getChordMidiNotes(currentRoot, currentQuality, currentInversion);

      // Update UI Text
      document.getElementById('chord-name-text').innerText = `${currentRoot} ${info.name.split(' ')[0]}`;
      document.getElementById('chord-formula-text').innerText = `${info.formula}｜${info.desc}`;

      // Update Note Badges
      const badgesContainer = document.getElementById('notes-badges');
      badgesContainer.innerHTML = '';
      midiNotes.forEach((midi, idx) => {
        const noteName = NOTE_NAMES[midi % 12];
        const badge = document.createElement('div');
        badge.className = `note-badge ${noteName === currentRoot ? 'is-root' : ''}`;
        badge.innerHTML = `<span class="n-name">${noteName}</span><span class="n-role">${roles[idx] || ''}</span>`;
        badgesContainer.appendChild(badge);
      });

      // Highlight Keys on Main Keyboard
      highlightPianoKeys('piano-keys', midiNotes, rootMidi);

      // 直接播放彈奏
      if (shouldPlay) {
        autoPlayCurrentChord();
      }
    }

    // --- Piano Rendering & Event Handling ---
    function renderPiano(containerId, isQuizMode = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      // Render 3 octaves: C3 (MIDI 48) to B5 (MIDI 83)
      const startMidi = 48; 
      const totalKeys = 36;

      for (let i = 0; i < totalKeys; i++) {
        const midi = startMidi + i;
        const noteName = NOTE_NAMES[midi % 12];
        const isBlack = noteName.includes('#');

        const keyDiv = document.createElement('div');
        keyDiv.className = `key ${isBlack ? 'black' : 'white'}`;
        keyDiv.dataset.midi = midi;
        keyDiv.dataset.note = noteName;

        const label = document.createElement('span');
        label.className = 'key-label';
        label.innerText = (midi % 12 === 0 || i === 0) ? `${noteName}${Math.floor(midi/12)-1}` : (isBlack ? '' : noteName);
        keyDiv.appendChild(label);

        // Click / Touch listener
        keyDiv.addEventListener('mousedown', (e) => {
          e.preventDefault();
          playTone(midi);
          keyDiv.classList.add('pressed');

          if (isQuizMode) {
            if (userSelectedKeys.has(midi)) {
              userSelectedKeys.delete(midi);
              keyDiv.classList.remove('highlight-user');
            } else {
              userSelectedKeys.add(midi);
              keyDiv.classList.add('highlight-user');
            }
          }
        });

        keyDiv.addEventListener('mouseup', () => keyDiv.classList.remove('pressed'));
        keyDiv.addEventListener('mouseleave', () => keyDiv.classList.remove('pressed'));

        container.appendChild(keyDiv);
      }
    }

    function highlightPianoKeys(containerId, targetMidis, rootMidi) {
      const container = document.getElementById(containerId);
      const keys = container.querySelectorAll('.key');

      keys.forEach(key => {
        const midi = parseInt(key.dataset.midi);
        key.classList.remove('highlight-root', 'highlight-chord');

        if (targetMidis.includes(midi)) {
          if (midi % 12 === rootMidi % 12) {
            key.classList.add('highlight-root');
          } else {
            key.classList.add('highlight-chord');
          }
        }
      });
    }

    // Playback functions
    function playCurrentChord() {
      const { midiNotes } = getChordMidiNotes(currentRoot, currentQuality, currentInversion);
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      midiNotes.forEach(midi => playTone(midi, now, 2.0));
    }

    function playArpeggio() {
      const { midiNotes } = getChordMidiNotes(currentRoot, currentQuality, currentInversion);
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      midiNotes.forEach((midi, idx) => {
        playTone(midi, now + idx * 0.25, 1.2);
      });
    }

    // --- Tab Switching ---
    function switchTab(tabName, evt) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (evt && evt.target) evt.target.classList.add('active');

      document.getElementById('tab-library').style.display = tabName === 'library' ? 'block' : 'none';
      document.getElementById('tab-quiz').style.display = tabName === 'quiz' ? 'block' : 'none';
      document.getElementById('tab-progression').style.display = tabName === 'progression' ? 'block' : 'none';
    }

    // --- Quiz Logic ---
    function nextQuizQuestion() {
      userSelectedKeys.clear();
      document.querySelectorAll('#quiz-piano-keys .key').forEach(k => k.classList.remove('highlight-user', 'pressed'));

      const randomRoot = NOTE_NAMES[Math.floor(Math.random() * NOTE_NAMES.length)];
      const qualityKeys = Object.keys(CHORD_TYPES);
      const randomQuality = qualityKeys[Math.floor(Math.random() * qualityKeys.length)];

      const { midiNotes } = getChordMidiNotes(randomRoot, randomQuality, 0, 4);
      quizTarget = {
        root: randomRoot,
        quality: randomQuality,
        notes: midiNotes.map(m => m % 12), // pitch classes
        fullMidis: midiNotes
      };

      document.getElementById('quiz-target-chord').innerText = `${randomRoot} ${CHORD_TYPES[randomQuality].name.split(' ')[0]}`;
      document.getElementById('quiz-feedback').innerText = '請在上方鍵盤上按出此和弦的所有音階，點擊後送出！';
      document.getElementById('quiz-feedback').className = 'feedback-msg';
    }

    function playQuizTargetChord() {
      if (!quizTarget) return;
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      quizTarget.fullMidis.forEach(midi => playTone(midi, now, 1.8));
    }

    function checkQuizAnswer() {
      if (!quizTarget) return;

      const userPitches = Array.from(userSelectedKeys).map(m => m % 12);
      const targetPitches = quizTarget.notes;

      // Compare set equality of pitch classes
      const isCorrect = userPitches.length === targetPitches.length &&
                        userPitches.every(p => targetPitches.includes(p));

      const fb = document.getElementById('quiz-feedback');
      if (isCorrect) {
        quizScore += 10;
        quizStreak += 1;
        fb.innerText = '🎉 答對了！太棒了！音符完全正確！';
        fb.className = 'feedback-msg correct';
        playQuizTargetChord();
        setTimeout(nextQuizQuestion, 1500);
      } else {
        quizStreak = 0;
        fb.innerText = '❌ 答案不太對喔，再聽一次或重新選取琴音試試看！';
        fb.className = 'feedback-msg wrong';
      }

      document.getElementById('quiz-score').innerText = quizScore;
      document.getElementById('quiz-streak').innerText = quizStreak;
    }

    // --- Progression Practice ---
    const PROGRESSIONS = [
      {
        title: 'Pop 流行萬用進行 (1 - 5 - 6 - 4)',
        desc: '無數熱門華語流行歌與西洋單曲的核心和弦骨架 (C - G - Am - F)',
        chords: [
          { root: 'C', quality: 'maj' },
          { root: 'G', quality: 'maj' },
          { root: 'A', quality: 'm' },
          { root: 'F', quality: 'maj' }
        ]
      },
      {
        title: 'Jazz 經典 2-5-1 進行 (Dm7 - G7 - Cmaj7)',
        desc: '爵士與流行樂最極致優美的解決導進音形',
        chords: [
          { root: 'D', quality: 'm7' },
          { root: 'G', quality: '7' },
          { root: 'C', quality: 'maj7' }
        ]
      },
      {
        title: 'Canon 卡農經典進行 (1-5-6-3-4-1-4-5)',
        desc: '雋永和諧的經典和弦進行，教會詩歌與 weddings 最愛',
        chords: [
          { root: 'C', quality: 'maj' },
          { root: 'G', quality: 'maj' },
          { root: 'A', quality: 'm' },
          { root: 'E', quality: 'm' },
          { root: 'F', quality: 'maj' },
          { root: 'C', quality: 'maj' },
          { root: 'F', quality: 'maj' },
          { root: 'G', quality: 'maj' }
        ]
      },
      {
        title: 'Sus2 溫柔懸空裝飾進行 (C - Csus2 - C - Fsus2)',
        desc: '充滿現代敬拜與溫暖安撫感的情感音色',
        chords: [
          { root: 'C', quality: 'maj' },
          { root: 'C', quality: 'sus2' },
          { root: 'C', quality: 'maj' },
          { root: 'F', quality: 'sus2' }
        ]
      }
    ];

    function getFingering(qualityKey) {
      if (['7', 'maj7', 'm7'].includes(qualityKey)) {
        return [1, 2, 3, 5]; // 四音和弦: 拇、食、中、小指
      } else if (qualityKey === 'sus2' || qualityKey === 'sus4') {
        return [1, 2, 5];
      } else {
        return [1, 3, 5]; // 標準三和弦: 拇、中、小指
      }
    }

    const FINGER_NAME_MAP = { 1: '拇指', 2: '食指', 3: '中指', 4: '無名指', 5: '小指' };

    let progTimeouts = [];
    let isProgLoop = true;

    function toggleProgLoop() {
      isProgLoop = !isProgLoop;
      const btn = document.getElementById('btn-toggle-loop');
      if (isProgLoop) {
        btn.classList.add('active');
        btn.innerText = '🔁 循環重複播放：開啟';
      } else {
        btn.classList.remove('active');
        btn.innerText = '🔁 循環重複播放：關閉';
      }
    }

    function initProgressions() {
      const container = document.getElementById('progression-list');
      container.innerHTML = '';

      PROGRESSIONS.forEach((prog, pIdx) => {
        const card = document.createElement('div');
        card.className = 'prog-card';
        card.id = `prog-card-${pIdx}`;

        let chordTagsHtml = prog.chords.map((c, cIdx) => 
          `<span class="prog-chord-tag" id="tag-${pIdx}-${cIdx}">${c.root}${c.quality === 'maj' ? '' : c.quality}</span>`
        ).join('');

        card.innerHTML = `
          <h3>${prog.title}</h3>
          <p>${prog.desc}</p>
          <div class="prog-chords">${chordTagsHtml}</div>
        `;

        card.onclick = () => playProgression(prog, pIdx);
        container.appendChild(card);
      });

      // 預設載入第一個進行的指法與琴鍵靜態顯示
      if (PROGRESSIONS.length > 0) {
        showProgressionChord(PROGRESSIONS[0].chords[0], PROGRESSIONS[0].title);
      }
    }

    function clearProgressionHighlights() {
      progTimeouts.forEach(t => clearTimeout(t));
      progTimeouts = [];

      document.querySelectorAll('.prog-card').forEach(c => c.style.borderColor = '');
      document.querySelectorAll('.prog-chord-tag').forEach(t => {
        t.style.background = '#1e293b';
        t.style.color = 'var(--accent)';
      });

      const progContainer = document.getElementById('prog-piano-keys');
      progContainer.querySelectorAll('.key').forEach(k => {
        k.classList.remove('highlight-root', 'highlight-chord');
        const badge = k.querySelector('.finger-badge');
        if (badge) badge.remove();
      });
    }

    function showProgressionChord(c, titleText = '') {
      const { rootMidi, midiNotes } = getChordMidiNotes(c.root, c.quality, 0, 4);
      const fingers = getFingering(c.quality);
      const qualityName = CHORD_TYPES[c.quality] ? CHORD_TYPES[c.quality].name.split(' ')[0] : c.quality;

      const progContainer = document.getElementById('prog-piano-keys');
      const keys = progContainer.querySelectorAll('.key');

      // 清除舊指法與高亮
      keys.forEach(k => {
        k.classList.remove('highlight-root', 'highlight-chord');
        const badge = k.querySelector('.finger-badge');
        if (badge) badge.remove();
      });

      // 標註指法與琴鍵高亮
      midiNotes.forEach((midi, idx) => {
        const fingerNum = fingers[idx] || (idx + 1);
        keys.forEach(k => {
          if (parseInt(k.dataset.midi) === midi) {
            if (midi % 12 === rootMidi % 12) {
              k.classList.add('highlight-root');
            } else {
              k.classList.add('highlight-chord');
            }

            // 附加上指法徽章 (1, 2, 3, 5)
            const badge = document.createElement('div');
            badge.className = 'finger-badge';
            badge.innerText = fingerNum;
            k.appendChild(badge);
          }
        });
      });

      // 更新說明
      const fingerText = fingers.map(f => `${f}(${FINGER_NAME_MAP[f]})`).join(' - ');
      document.getElementById('prog-current-title').innerText = `🎹 當前彈奏：${c.root} ${qualityName} ${titleText ? '（' + titleText + '）' : ''}`;
      document.getElementById('prog-finger-info').innerText = `右手建議指法：${fingerText}`;
    }

    function playProgression(prog, pIdx) {
      clearProgressionHighlights();

      const card = document.getElementById(`prog-card-${pIdx}`);
      if (card) card.style.borderColor = 'var(--primary)';

      const ctx = getAudioContext();

      prog.chords.forEach((c, cIdx) => {
        const delayMs = cIdx * 1200;

        // 排程聲音與畫面同步
        const tSound = setTimeout(() => {
          const { midiNotes } = getChordMidiNotes(c.root, c.quality, 0, 4);
          midiNotes.forEach(midi => playTone(midi, 0, 1.4));

          // 視覺 Tag 高亮
          document.querySelectorAll('.prog-chord-tag').forEach(t => {
            t.style.background = '#1e293b';
            t.style.color = 'var(--accent)';
          });
          const currentTag = document.getElementById(`tag-${pIdx}-${cIdx}`);
          if (currentTag) {
            currentTag.style.background = 'var(--primary)';
            currentTag.style.color = '#ffffff';
          }

          // 畫面預覽琴鍵指法
          showProgressionChord(c, prog.title.split(' ')[0]);

        }, delayMs);

        progTimeouts.push(tSound);
      });

      // 若啟用循環播放，於全數播放完畢後自動重新呼叫
      if (isProgLoop) {
        const loopDelayMs = prog.chords.length * 1200 + 400;
        const tLoop = setTimeout(() => {
          playProgression(prog, pIdx);
        }, loopDelayMs);
        progTimeouts.push(tLoop);
      }
    }
  </script>
</body>

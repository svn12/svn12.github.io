<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>社區公設缺失與修繕追蹤系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    .status-badge-待處理 { background-color: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
    .status-badge-建商查勘中 { background-color: #ffedd5; color: #c2410c; border-color: #fdba74; }
    .status-badge-國霖驗收列管 { background-color: #fef3c7; color: #b45309; border-color: #fcd34d; }
    .status-badge-已改善待複驗 { background-color: #e0e7ff; color: #4338ca; border-color: #a5b4fc; }
    .status-badge-已結案 { background-color: #dcfce7; color: #15803d; border-color: #86efac; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-xl font-bold shadow-inner">
          <i class="fa-solid fa-building-circle-exclamation"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">品陽大苑｜大樓公設缺失追蹤系統</h1>
          <p class="text-xs text-slate-400">住戶提報・第三方驗收（國霖）列管・修繕比對平台</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openModal()" class="inline-flex items-center gap-1.5 px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">
          <i class="fa-solid fa-plus"></i> 新增缺失項目
        </button>
        <button onclick="exportCSV()" class="inline-flex items-center gap-1.5 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-file-export"></i> 匯出 CSV
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-6">

    <!-- KPI Dashboard Cards -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-slate-500 font-medium">總提報項目</div>
        <div class="text-2xl font-black text-slate-800 mt-1" id="stat-total">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-red-500 font-medium">待處理 / 緊急</div>
        <div class="text-2xl font-black text-red-600 mt-1" id="stat-pending">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-amber-500 font-medium">國霖驗收列管</div>
        <div class="text-2xl font-black text-amber-600 mt-1" id="stat-inspection">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-orange-500 font-medium">建商查勘中</div>
        <div class="text-2xl font-black text-orange-600 mt-1" id="stat-surveying">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-indigo-500 font-medium">已改善待複驗</div>
        <div class="text-2xl font-black text-indigo-600 mt-1" id="stat-reverify">0</div>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs text-emerald-500 font-medium">已結案</div>
        <div class="text-2xl font-black text-emerald-600 mt-1" id="stat-closed">0</div>
      </div>
    </section>

    <!-- Filters & Search Bar -->
    <section class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
        <!-- Keyword Search -->
        <div class="md:col-span-2 relative">
          <label class="block text-xs font-semibold text-slate-500 mb-1">關鍵字搜尋 (編號/地點/描述/提報人)</label>
          <div class="relative">
            <input type="text" id="filter-keyword" oninput="renderTable()" placeholder="輸入關鍵字，如：漏水、水錘、B4、電梯..." 
                   class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
        </div>

        <!-- Category Filter -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">系統分類</label>
          <select id="filter-category" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">全部系統分類</option>
            <option value="漏水滲水">漏水滲水 (全棟防水)</option>
            <option value="給排水系統">給排水系統 (水壓/水錘)</option>
            <option value="門禁弱電">門禁弱電 (車道/感應)</option>
            <option value="消防安檢">消防安檢 (警報/排煙)</option>
            <option value="土建五金">土建裝修與五金</option>
            <option value="環境管理">環境衛生與管理</option>
          </select>
        </div>

        <!-- Area Filter -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">空間區域</label>
          <select id="filter-area" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">全部區域</option>
            <option value="頂樓/RF">頂樓 / RF 露台</option>
            <option value="地下室">地下停車場 (B1~B4)</option>
            <option value="梯廳/逃生梯">梯廳 / 逃生樓梯間</option>
            <option value="大廳/門廳">1F 大廳 / 櫃檯</option>
            <option value="車道">汽機車道</option>
            <option value="全棟供水系統">全棟供水幹管</option>
            <option value="2F公設">2F 健身房 / 媽媽教室</option>
          </select>
        </div>

        <!-- Status Filter -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">改善狀態</label>
          <select id="filter-status" onchange="renderTable()" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="">全部狀態</option>
            <option value="待處理">待處理</option>
            <option value="國霖驗收列管">國霖驗收列管</option>
            <option value="建商查勘中">建商查勘中</option>
            <option value="已改善待複驗">已改善待複驗</option>
            <option value="已結案">已結案</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Table Section -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-100 flex items-center justify-between">
        <h2 class="font-bold text-slate-800 text-sm">缺失項目清單 (<span id="filtered-count">0</span> 項)</h2>
        <span class="text-xs text-slate-500">點擊任一項目查看現場相片與修繕明細</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-50 text-slate-600 font-semibold text-xs uppercase tracking-wider border-b border-slate-200">
              <th class="py-3 px-4">編號</th>
              <th class="py-3 px-3">提報日期</th>
              <th class="py-3 px-3">區域與位置</th>
              <th class="py-3 px-3">系統類別</th>
              <th class="py-3 px-4">缺失詳情摘要</th>
              <th class="py-3 px-3 text-center">現場相片</th>
              <th class="py-3 px-3">狀態</th>
              <th class="py-3 px-3 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="defect-table-body" class="divide-y divide-slate-100 text-slate-700">
            <!-- Rendered by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Detail / Photo Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-100 overflow-hidden my-auto max-h-[90vh] flex flex-col">
      <!-- Modal Header -->
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
          <span id="modal-id" class="font-mono px-2 py-0.5 rounded bg-indigo-600 text-xs font-bold">DEF-000</span>
          <h3 id="modal-title" class="text-base font-bold truncate">缺失詳情</h3>
        </div>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-6 space-y-5 overflow-y-auto">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs bg-slate-50 p-4 rounded-xl border border-slate-100">
          <div><span class="text-slate-400 block mb-1">提報日期</span><strong id="modal-date" class="text-slate-800 text-sm"></strong></div>
          <div><span class="text-slate-400 block mb-1">區域空間</span><strong id="modal-area" class="text-slate-800 text-sm"></strong></div>
          <div><span class="text-slate-400 block mb-1">系統分類</span><strong id="modal-cat" class="text-slate-800 text-sm"></strong></div>
          <div><span class="text-slate-400 block mb-1">提報住戶</span><strong id="modal-reporter" class="text-slate-800 text-sm"></strong></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">缺失詳情描述</label>
          <p id="modal-desc" class="text-sm text-slate-800 bg-amber-50/50 p-3 rounded-lg border border-amber-200/50 leading-relaxed"></p>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">建商回覆與改善進度</label>
          <p id="modal-progress" class="text-sm text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200"></p>
        </div>

        <!-- Photo Section -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">現場照片紀錄 (<span id="photo-count">0</span> 張)</label>
            <div class="flex items-center gap-3">
              <button type="button" id="btn-clear-photos" onclick="clearAllPhotos()" class="text-xs text-red-500 hover:text-red-700 font-medium hidden">
                <i class="fa-solid fa-trash-can"></i> 全部刪除
              </button>
              <label class="cursor-pointer inline-flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-700 font-semibold bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1 rounded-md transition">
                <i class="fa-solid fa-camera"></i> 上傳現場相片
                <input type="file" id="photo-upload-input" accept="image/*" multiple class="hidden" onchange="handlePhotoUpload(event)" />
              </label>
            </div>
          </div>
          
          <div id="modal-photo-gallery" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- Dynamic Photos -->
          </div>
          <p id="no-photo-hint" class="text-xs text-slate-400 italic py-4 text-center bg-slate-50 border border-dashed border-slate-200 rounded-lg">尚無照片，可點擊上方「上傳現場相片」新增</p>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-500">更新狀態：</span>
          <select id="modal-status-select" onchange="updateCurrentStatus(this.value)" class="text-xs py-1.5 px-2.5 border border-slate-300 rounded-md bg-white font-medium focus:outline-none">
            <option value="待處理">待處理</option>
            <option value="國霖驗收列管">國霖驗收列管</option>
            <option value="建商查勘中">建商查勘中</option>
            <option value="已改善待複驗">已改善待複驗</option>
            <option value="已結案">已結案</option>
          </select>
        </div>
        <button onclick="closeDetailModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-lg transition">關閉</button>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="create-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden my-auto">
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-bold text-base">新增公設缺失提報</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="create-form" onsubmit="handleCreateSubmit(event)" class="p-6 space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">提報日期</label>
            <input type="date" id="new-date" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">系統分類</label>
            <select id="new-cat" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm">
              <option value="漏水滲水">漏水滲水</option>
              <option value="給排水系統">給排水系統</option>
              <option value="門禁弱電">門禁弱電</option>
              <option value="消防安檢">消防安檢</option>
              <option value="土建五金">土建五金</option>
              <option value="環境管理">環境管理</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">空間區域</label>
            <input type="text" id="new-area" placeholder="例如：地下室、頂樓/RF" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">具體位置</label>
            <input type="text" id="new-location" placeholder="例如：B4車位54號上方" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">缺失詳情與現況描述</label>
          <textarea id="new-desc" rows="3" placeholder="詳細描述現況（如滴水、白華、聲響、異味等）" required class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">提報住戶 / 戶別</label>
            <input type="text" id="new-reporter" placeholder="例如：16-1陳宅" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">初始處理狀態</label>
            <select id="new-status" class="w-full py-2 px-3 border border-slate-300 rounded-lg text-sm">
              <option value="待處理">待處理</option>
              <option value="國霖驗收列管">國霖驗收列管</option>
              <option value="建商查勘中">建商查勘中</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">現場相片 (支援多張)</label>
          <input type="file" id="new-photos" accept="image/*" multiple class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
        </div>

        <div class="pt-3 flex justify-end gap-2 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium transition">取消</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow-sm transition">儲存提報</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Image Lightbox Modal -->
  <div id="lightbox-modal" class="fixed inset-0 z-60 bg-black/95 hidden flex flex-col items-center justify-center p-4">
    <!-- Top toolbar -->
    <div class="absolute top-4 right-4 flex items-center gap-3 z-10">
      <button type="button" onclick="deleteCurrentLightboxPhoto()" class="px-3.5 py-1.5 bg-red-600/90 hover:bg-red-700 text-white rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow transition">
        <i class="fa-solid fa-trash-can"></i> 刪除此張相片
      </button>
      <button type="button" onclick="closeLightbox()" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>
    <div class="max-w-4xl max-h-[85vh] flex items-center justify-center overflow-hidden">
      <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" />
    </div>
  </div>

    // Local Storage sync
    let defectList = JSON.parse(localStorage.getItem('pinyang_defects_v4')) || initialData;
    let currentDetailDefect = null;

    function saveData() {
      localStorage.setItem('pinyang_defects_v4', JSON.stringify(defectList));
      updateDashboardStats();
    }

    function updateDashboardStats() {
      document.getElementById('stat-total').innerText = defectList.length;
      document.getElementById('stat-pending').innerText = defectList.filter(d => d.status === '待處理').length;
      document.getElementById('stat-inspection').innerText = defectList.filter(d => d.status === '國霖驗收列管').length;
      document.getElementById('stat-surveying').innerText = defectList.filter(d => d.status === '建商查勘中').length;
      document.getElementById('stat-reverify').innerText = defectList.filter(d => d.status === '已改善待複驗').length;
      document.getElementById('stat-closed').innerText = defectList.filter(d => d.status === '已結案').length;
    }

    function renderTable() {
      const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
      const cat = document.getElementById('filter-category').value;
      const area = document.getElementById('filter-area').value;
      const status = document.getElementById('filter-status').value;

      const filtered = defectList.filter(item => {
        const matchKw = !keyword || 
          item.id.toLowerCase().includes(keyword) || 
          item.loc.toLowerCase().includes(keyword) || 
          item.desc.toLowerCase().includes(keyword) || 
          (item.reporter && item.reporter.toLowerCase().includes(keyword));
        const matchCat = !cat || item.cat === cat;
        const matchArea = !area || item.area.includes(area);
        const matchStatus = !status || item.status === status;
        return matchKw && matchCat && matchArea && matchStatus;
      });

      document.getElementById('filtered-count').innerText = filtered.length;
      const tbody = document.getElementById('defect-table-body');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400">沒有符合搜尋條件的缺失項目</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition cursor-pointer border-b border-slate-100";
        tr.onclick = (e) => {
          if (e.target.closest('button')) return;
          showDetail(item.id);
        };

        const photoCount = item.photos ? item.photos.length : 0;
        const photoBadge = photoCount > 0 
          ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200"><i class="fa-solid fa-images"></i> ${photoCount}</span>`
          : `<span class="text-slate-300 text-xs">-</span>`;

        tr.innerHTML = `
          <td class="py-3 px-4 font-mono font-bold text-xs text-indigo-700 whitespace-nowrap">${item.id}</td>
          <td class="py-3 px-3 text-xs text-slate-500 whitespace-nowrap">${item.date}</td>
          <td class="py-3 px-3 text-xs">
            <span class="font-semibold text-slate-800">${item.area}</span>
            <span class="block text-slate-500 truncate max-w-[130px]">${item.loc}</span>
          </td>
          <td class="py-3 px-3 text-xs whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 border border-slate-200 font-medium">${item.cat}</span>
          </td>
          <td class="py-3 px-4 text-xs">
            <div class="font-medium text-slate-800 line-clamp-1">${item.desc}</div>
            <div class="text-slate-400 text-[11px] truncate max-w-[320px]">${item.progress || '尚無進度備註'}</div>
          </td>
          <td class="py-3 px-3 text-center whitespace-nowrap">${photoBadge}</td>
          <td class="py-3 px-3 whitespace-nowrap">
            <span class="inline-block px-2 py-0.5 rounded-md text-[11px] font-bold border status-badge-${item.status}">${item.status}</span>
          </td>
          <td class="py-3 px-3 text-right whitespace-nowrap">
            <button onclick="showDetail('${item.id}')" class="p-1.5 text-indigo-600 hover:text-indigo-900 hover:bg-indigo-50 rounded transition" title="查看相片與細節">
              <i class="fa-solid fa-eye"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showDetail(id) {
      const item = defectList.find(d => d.id === id);
      if (!item) return;
      currentDetailDefect = item;

      document.getElementById('modal-id').innerText = item.id;
      document.getElementById('modal-title').innerText = item.loc;
      document.getElementById('modal-date').innerText = item.date;
      document.getElementById('modal-area').innerText = `${item.area} (${item.loc})`;
      document.getElementById('modal-cat').innerText = item.cat;
      document.getElementById('modal-reporter').innerText = item.reporter || '未註記';
      document.getElementById('modal-desc').innerText = item.desc;
      document.getElementById('modal-progress').innerText = item.progress || '尚無建商回覆紀錄';
      document.getElementById('modal-status-select').value = item.status;

      renderModalPhotos();
      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      currentDetailDefect = null;
      renderTable();
    }

    function updateCurrentStatus(newStatus) {
      if (!currentDetailDefect) return;
      currentDetailDefect.status = newStatus;
      saveData();
      renderTable();
    }

    let currentLightboxPhotoIndex = -1;

    function renderModalPhotos() {
      const gallery = document.getElementById('modal-photo-gallery');
      const noHint = document.getElementById('no-photo-hint');
      const countEl = document.getElementById('photo-count');
      const clearBtn = document.getElementById('btn-clear-photos');
      gallery.innerHTML = '';

      if (!currentDetailDefect.photos || currentDetailDefect.photos.length === 0) {
        noHint.classList.remove('hidden');
        if (clearBtn) clearBtn.classList.add('hidden');
        countEl.innerText = '0';
        return;
      }

      noHint.classList.add('hidden');
      if (clearBtn) clearBtn.classList.remove('hidden');
      countEl.innerText = currentDetailDefect.photos.length;

      currentDetailDefect.photos.forEach((src, idx) => {
        const div = document.createElement('div');
        div.className = "relative group rounded-xl overflow-hidden border border-slate-200 bg-slate-100 aspect-video flex items-center justify-center shadow-sm";
        div.innerHTML = `
          <img src="${src}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition duration-300" onclick="openLightbox(${idx})" />
          <button type="button" onclick="event.stopPropagation(); removePhoto(${idx});" 
                  class="absolute top-2 right-2 px-2 py-1 bg-red-600/90 hover:bg-red-700 text-white rounded-md text-xs font-semibold flex items-center gap-1 opacity-90 sm:opacity-0 sm:group-hover:opacity-100 transition shadow" 
                  title="刪除照片">
            <i class="fa-solid fa-trash-can"></i> <span>刪除</span>
          </button>
        `;
        gallery.appendChild(div);
      });
    }

    function handlePhotoUpload(e) {
      if (!currentDetailDefect) return;
      const files = e.target.files;
      if (!files || files.length === 0) return;

      if (!currentDetailDefect.photos) currentDetailDefect.photos = [];

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentDetailDefect.photos.push(evt.target.result);
          saveData();
          renderModalPhotos();
          renderTable();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    function removePhoto(index) {
      if (!currentDetailDefect) return;
      if (confirm('確定刪除這張現場照片？')) {
        currentDetailDefect.photos.splice(index, 1);
        saveData();
        renderModalPhotos();
        renderTable();
      }
    }

    function clearAllPhotos() {
      if (!currentDetailDefect || !currentDetailDefect.photos || currentDetailDefect.photos.length === 0) return;
      if (confirm(`確定刪除本項目的所有照片 (共 ${currentDetailDefect.photos.length} 張)？`)) {
        currentDetailDefect.photos = [];
        saveData();
        renderModalPhotos();
        renderTable();
      }
    }

    function openLightbox(index) {
      if (!currentDetailDefect || !currentDetailDefect.photos) return;
      currentLightboxPhotoIndex = index;
      const src = currentDetailDefect.photos[index];
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-modal').classList.remove('hidden');
    }

    function deleteCurrentLightboxPhoto() {
      if (!currentDetailDefect || currentLightboxPhotoIndex < 0) return;
      if (confirm('確定刪除目前檢視的這張照片？')) {
        currentDetailDefect.photos.splice(currentLightboxPhotoIndex, 1);
        saveData();
        closeLightbox();
        renderModalPhotos();
        renderTable();
      }
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
      currentLightboxPhotoIndex = -1;
    }

    // Create Modal handlers
    function openModal() {
      document.getElementById('new-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('create-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('create-modal').classList.add('hidden');
      document.getElementById('create-form').reset();
    }

    function handleCreateSubmit(e) {
      e.preventDefault();
      const maxIdNum = defectList.reduce((max, d) => {
        const num = parseInt(d.id.replace('DEF-', ''), 10) || 0;
        return num > max ? num : max;
      }, 0);
      const nextId = `DEF-${String(maxIdNum + 1).padStart(3, '0')}`;

      const newDefect = {
        id: nextId,
        date: document.getElementById('new-date').value,
        area: document.getElementById('new-area').value,
        loc: document.getElementById('new-location').value,
        cat: document.getElementById('new-cat').value,
        desc: document.getElementById('new-desc').value,
        reporter: document.getElementById('new-reporter').value || '住戶提報',
        status: document.getElementById('new-status').value,
        progress: '尚未排定查驗',
        photos: []
      };

      const photoFiles = document.getElementById('new-photos').files;
      if (photoFiles && photoFiles.length > 0) {
        let loaded = 0;
        Array.from(photoFiles).forEach(f => {
          const reader = new FileReader();
          reader.onload = function(evt) {
            newDefect.photos.push(evt.target.result);
            loaded++;
            if (loaded === photoFiles.length) {
              defectList.unshift(newDefect);
              saveData();
              closeModal();
              renderTable();
            }
          };
          reader.readAsDataURL(f);
        });
      } else {
        defectList.unshift(newDefect);
        saveData();
        closeModal();
        renderTable();
      }
    }

    function exportCSV() {
      let csvContent = "\uFEFF編號,提報日期,區域空間,具體位置,系統分類,缺失描述,提報人,狀態,改善進度\n";
      defectList.forEach(d => {
        csvContent += `"${d.id}","${d.date}","${d.area}","${d.loc}","${d.cat}","${d.desc.replace(/"/g, '""')}","${d.reporter}","${d.status}","${(d.progress||'').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `品陽大苑_公設缺失清單_${new Date().toISOString().split('T')[0]}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Init
    updateDashboardStats();
    renderTable();
  </script>
</body>
</html>

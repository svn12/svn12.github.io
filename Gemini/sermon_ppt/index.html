<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南門教會主日排版助手</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-start: #080612;
            --bg-end: #0f0c20;
            --panel-bg: rgba(255, 255, 255, 0.03);
            --panel-border: rgba(255, 255, 255, 0.07);
            --primary-glow: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            --button-hover: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            --accent-success: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --success-hover: linear-gradient(135deg, #059669 0%, #047857 100%);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --accent-warning: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #4f46e5;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            bottom: -150px;
            right: -150px;
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            z-index: 10;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 40%, var(--text-sub) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .tabs-header {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 0.35rem;
            margin-bottom: 1.8rem;
            gap: 0.3rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            color: var(--text-sub);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn.active {
            background: var(--primary-glow);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .drop-zone {
            border: 2px dashed var(--panel-border);
            border-radius: 12px;
            padding: 1.3rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.005);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }

        .drop-zone p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .drop-zone-icon {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            margin-bottom: 1.8rem;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace, 'Noto Sans TC';
            font-size: 0.9rem;
            line-height: 1.5;
            resize: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .preview-area {
            width: 100%;
            height: 380px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .bible-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            height: 380px;
            justify-content: flex-start;
        }

        .input-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            position: relative;
        }

        .text-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .select-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #100e23;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .select-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-action {
            width: 100%;
            background: var(--primary-glow);
            border: none;
            padding: 0.9rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-action:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.35);
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2rem;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .control-label {
            display: flex;
            flex-direction: column;
        }

        .control-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .control-desc {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 20px;
            border: 1px solid var(--panel-border);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--primary-glow);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .number-input {
            width: 60px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.3rem;
            border-radius: 6px;
            text-align: center;
            font-family: inherit;
            font-size: 0.85rem;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        @media (max-width: 500px) {
            .button-group {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            border: none;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s ease;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-download {
            background: var(--accent-success);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
        }

        .btn-download:hover {
            background: var(--success-hover);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* 聖詩/啟應文專用樣式 */
        .hymns-table-wrapper {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            margin-top: 1.2rem;
            overflow-x: auto;
        }

        .hymns-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        .hymns-table th {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
            padding: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            border-bottom: 1px solid var(--panel-border);
        }

        .hymns-table td {
            padding: 0.8rem 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-sub);
            vertical-align: middle;
        }

        .hymns-table tr:hover td {
            color: white;
            background: rgba(255, 255, 255, 0.02);
        }

        .hymns-link-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-link-db {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .btn-link-db:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .btn-link-gd {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn-link-gd:hover {
            background: var(--accent-warning);
            color: white;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        .btn-link-yt {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-link-yt:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        .yt-player-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            margin-top: 1.5rem;
            position: relative;
            background: black;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            aspect-ratio: 16/9;
        }

        .yt-player-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            background: rgba(16, 14, 35, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 0.3rem;
        }

        .autocomplete-items div {
            padding: 0.7rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-sub);
            transition: all 0.2s ease;
        }

        .autocomplete-items div:hover {
            background: rgba(99, 102, 241, 0.15);
            color: white;
        }

        .autocomplete-active {
            background: var(--primary-glow) !important;
            color: white !important;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <div class="container">
        <header>
            <h1>南門教會主日排版助手</h1>
            <p class="subtitle">歌詞與經文的一鍵排版工具，專門輸出免跑版的純文字字幕對照檔</p>
        </header>

        <!-- Tabs Header -->
        <div class="tabs-header">
            <button class="tab-btn active" id="tab-lyrics">🎵 聖歌隊歌詞排版</button>
            <button class="tab-btn" id="tab-scripture">📖 聖經經文抓取</button>
            <button class="tab-btn" id="tab-hymns">🎵 聖詩與啟應文</button>
        </div>

        <main>
            <!-- 歌詞模式檔案上傳 -->
            <div class="tab-content active" id="content-lyrics">
                <div class="drop-zone" id="drop-zone">
                    <div class="drop-zone-icon">📄</div>
                    <p>將歌詞文字檔 (.txt) 拖曳到此處，或<strong>點擊選擇檔案</strong></p>
                    <input type="file" id="file-input" accept=".txt" style="display: none;">
                </div>
            </div>

            <!-- 主排版區 -->
            <div class="main-layout">
                <!-- 左側輸入區 -->
                <div>
                    <!-- 歌詞輸入面板 -->
                    <div class="tab-content active" id="input-lyrics">
                        <div class="panel-title">📝 原始歌詞輸入</div>
                        <textarea id="lyrics-textarea" placeholder="請在此貼上歌詞。&#10;如果啟用了「自動解析介紹」，前 5 行應為：歌名、團體、日期、指揮、司琴。"></textarea>
                    </div>

                    <!-- 經文輸入面板 -->
                    <div class="tab-content" id="input-scripture">
                        <div class="panel-title">🔍 經文抓取設定</div>
                        <div class="bible-input-group">
                            <div class="input-item">
                                <label for="bible-qstr" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">引用經文範圍</label>
                                <input type="text" id="bible-qstr" class="text-input" placeholder="例如: 耶利米書 36:1-8 或 耶36:1-8">
                            </div>
                            
                            <div class="input-item">
                                <label for="bible-version" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">譯本選擇</label>
                                <select id="bible-version" class="select-input">
                                    <option value="parallel">中台譯本逐節對照 (和合本2010 + 台語巴克禮)</option>
                                    <option value="rcuv">中文和合本2010 (rcuv)</option>
                                    <option value="tghg">台語巴克禮台漢本 (tghg)</option>
                                </select>
                            </div>

                            <div class="input-item">
                                <label for="bible-format" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">排版輸出格式</label>
                                <select id="bible-format" class="select-input">
                                    <option value="slide">🖥️ 簡報貼上格式 (每節獨立全稱標題 + 空行)</option>
                                    <option value="report">📋 週報複製格式 (每行開頭簡寫，無空行)</option>
                                </select>
                            </div>

                            <button class="btn-action" id="btn-fetch-bible">
                                <div class="spinner" id="fetch-spinner"></div>
                                <span id="fetch-btn-text">🚀 抓取並排版經文</span>
                            </button>
                        </div>
                    </div>

                    <!-- 聖詩與啟應文面板 -->
                    <div class="tab-content" id="input-hymns">
                        <div class="panel-title">🔍 聖詩與啟應文查詢</div>
                        <div class="bible-input-group" style="height: auto;">
                            <div class="input-item">
                                <label for="hymns-select-tag" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">詩歌類別</label>
                                <select id="hymns-select-tag" class="select-input">
                                    <option value="新聖詩" selected>新聖詩 (001-650)</option>
                                    <option value="啟應文">啟應文 (01-66)</option>
                                    <option value="聖詩">舊聖詩</option>
                                    <option value="List">聖歌隊雅音</option>
                                    <option value="聖歌隊2">聖歌隊自動</option>
                                    <option value="讚美之泉">讚美之泉</option>
                                    <option value="讚美詩網">讚美之泉約書亞</option>
                                </select>
                            </div>

                            <div class="input-item">
                                <label for="hymns-select-sub" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">目錄細項</label>
                                <select id="hymns-select-sub" class="select-input">
                                    <!-- 動態加載 -->
                                </select>
                            </div>

                            <div class="input-item">
                                <label for="hymns-input-query" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">歌名或首別關鍵字</label>
                                <input type="text" id="hymns-input-query" class="text-input" placeholder="輸入歌名或數字進行檢索...">
                            </div>

                            <div class="input-item">
                                <label for="hymns-play-mode" style="font-size:0.85rem; font-weight:600; color:var(--text-sub);">自動連續播放模式</label>
                                <select id="hymns-play-mode" class="select-input">
                                    <option value="sequential" selected>🔁 循序播放</option>
                                    <option value="random">🔀 隨機播放</option>
                                </select>
                            </div>

                            <button class="btn-action" id="hymns-btn-search">
                                <span id="hymns-search-text">🔍 查詢詩歌連結</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 右側輸出預覽區 -->
                <div>
                    <div class="panel-title">✨ 排版預覽與播放結果</div>
                    <!-- 歌詞與經文預覽 -->
                    <div id="wrapper-text-preview">
                        <div class="preview-area" id="preview-area"></div>
                    </div>
                    
                    <!-- 聖詩啟應文預覽 & 播放區 -->
                    <div id="wrapper-hymns-preview" style="display: none;">
                        <div class="hymns-table-wrapper">
                            <div id="hymns-table-container"></div>
                        </div>
                        <div class="yt-player-box" id="hymns-player-box">
                            <div id="youtube-player"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制列 (歌詞模式專屬) -->
            <div class="controls-row" id="controls-row-lyrics">
                <div class="control-item" id="ctrl-auto-header">
                    <div class="control-label">
                        <span class="control-title">自動解析介紹</span>
                        <span class="control-desc">自動分析前5行基本資訊與詞曲作者</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="auto-header" checked>
                        <span class="slider"></span>

        // 歌詞語意分行
        function splitLongLine(line, maxLen = 15) {
            line = line.trim();
            if (line.length <= maxLen) {
                return [line];
            }
            
            const delimiters = [
                /[，,；;！!？?。.]/,
                /[\s　]/
            ];
            
            let bestSplitIdx = -1;
            let minDistToCenter = line.length;
            const center = line.length / 2;
            
            for (let pattern of delimiters) {
                let match;
                const regex = new RegExp(pattern, 'g');
                while ((match = regex.exec(line)) !== null) {
                    const idx = match.index + match[0].length;
                    const dist = Math.abs(idx - center);
                    if (dist < minDistToCenter) {
                        minDistToCenter = dist;
                        bestSplitIdx = idx;
                    }
                }
                if (bestSplitIdx !== -1) break;
            }
            
            if (bestSplitIdx === -1 || bestSplitIdx === 0 || bestSplitIdx === line.length) {
                bestSplitIdx = Math.floor(center);
            }
            
            const left = line.substring(0, bestSplitIdx).trim();
            const right = line.substring(bestSplitIdx).trim();
            
            return splitLongLine(left, maxLen).concat(splitLongLine(right, maxLen));
        }

        // 歌詞切頁
        function chunkRawLyrics(text, linesPerPage = 2, maxLen = 15) {
            const rawLines = text.split('\n').map(l => l.trim()).filter(l => l);
            const processedLines = [];
            for (let line of rawLines) {
                processedLines.push(...splitLongLine(line, maxLen));
            }
            
            const pages = [];
            let pageIdx = 1;
            for (let i = 0; i < processedLines.length; i += linesPerPage) {
                pages.push({
                    page: `P${pageIdx}`,
                    lines: processedLines.slice(i, i + linesPerPage)
                });
                pageIdx++;
            }
            return pages;
        }

        // 歌詞解析 Header
        function parseAutoHeaderFile(content) {
            const lines = content.split('\n').map(l => l.trim()).filter(l => l);
            const metadata = {};
            const lyricsLines = [];
            
            if (lines.length >= 1) metadata.title = lines[0];
            if (lines.length >= 2) metadata.group = lines[1];
            if (lines.length >= 3) metadata.date = lines[2];
            if (lines.length >= 4) metadata.conductor_line = lines[3];
            if (lines.length >= 5) metadata.accompanist_line = lines[4];
            
            let inHeader = true;
            for (let i = 5; i < lines.length; i++) {
                const line = lines[i];
                if (inHeader) {
                    let isIntro = false;
                    if (line === metadata.title) {
                        isIntro = true;
                    } else if (/(words by|music_by|music by|詞曲|台語|翻譯|譯詞|指揮|司琴|伴奏|配器|arr\.|arranged by)/i.test(line)) {
                        isIntro = true;
                        if (/words\s+by/i.test(line)) {
                            metadata.words_by = line.replace(/words\s+by\s*/i, '').trim();
                        } else if (/music\s+by/i.test(line)) {
                            metadata.music_by = line.replace(/music\s+by\s*/i, '').trim();
                        } else if (/詞曲/.test(line)) {
                            metadata.composer = line.replace(/^詞曲\s*/, '').trim();
                        } else if (/台語/.test(line)) {
                            metadata.translator = line.replace(/^台語\s*/, '').trim();
                        }
                    }
                    
                    if (isIntro) continue;
                    else inHeader = false;
                }
                lyricsLines.push(line);
            }
            
            return {
                metadata: metadata,
                lyricsText: lyricsLines.join('\n')
            };
        }

        // 歌詞排版輸出
        function formatOutputText(metadata, lyricsPages, autoHeader) {
            let outputLines = [];
            
            if (autoHeader) {
                const hasComposer = metadata.composer || metadata.translator || metadata.words_by || metadata.music_by;
                const totalPages = hasComposer ? 4 : 3;
                let pageIdx = 1;
                
                outputLines.push(`P0-${pageIdx}/${totalPages}`);
                outputLines.push(`\t${metadata.title || ''}`);
                pageIdx++;
                
                if (hasComposer) {
                    outputLines.push(`P0-${pageIdx}/${totalPages}`);
                    if (metadata.words_by) outputLines.push(`\tWords by ${metadata.words_by}`);
                    if (metadata.music_by) outputLines.push(`\tMusic by ${metadata.music_by}`);
                    if (metadata.composer) outputLines.push(`\t詞曲 ${metadata.composer}`);
                    if (metadata.translator) outputLines.push(`\t台語 ${metadata.translator}`);
                    pageIdx++;
                }
                
                outputLines.push(`P0-${pageIdx}/${totalPages}`);
                if (metadata.group) outputLines.push(`\t${metadata.group}`);
                if (metadata.date) outputLines.push(`\t${metadata.date}`);
                pageIdx++;
                
                outputLines.push(`P0-${pageIdx}/${totalPages}`);
                if (metadata.conductor_line) outputLines.push(`\t${metadata.conductor_line}`);
                if (metadata.accompanist_line) outputLines.push(`\t${metadata.accompanist_line}`);
            }
            
            lyricsPages.forEach(page => {
                outputLines.push(page.page);
                page.lines.forEach(l => {
                    outputLines.push(`\t${l}`);
                });
            });
            
            return outputLines.join('\n');
        }

        function updateLyricsLayout() {
            const rawText = textarea.value.trim();

            const autoHeader = document.getElementById('auto-header').checked;

            let metadata = {};
            let lyricsPages = [];

            if (autoHeader) {
                const parsed = parseAutoHeaderFile(rawText);
                metadata = parsed.metadata;
                lyricsPages = chunkRawLyrics(parsed.lyricsText, 2, maxLen);
            } else {
                metadata = { title: rawText.split('\n')[0].trim() || '歌詞字幕' };
                lyricsPages = chunkRawLyrics(rawText, 2, maxLen);
            }

            const formattedText = formatOutputText(metadata, lyricsPages, autoHeader);
            previewArea.textContent = formattedText;
            currentFormattedResult = formattedText;
        }

        // 聖經經文抓取與對照
        function cleanHtml(rawHtml) {
            if (!rawHtml) return "";
            let clean = rawHtml.replace(/<.*?>/g, "");
            clean = clean.replace(/[#|]/g, "");
            return clean.replace(/\s+/g, " ").trim();
        }

        function normalizeQstr(qstr) {
            const sortedKeys = Object.keys(BIBLE_BOOKS_MAP).sort((a, b) => b.length - a.length);
            let normalized = qstr;
            for (let key of sortedKeys) {
                const val = BIBLE_BOOKS_MAP[key];
                if (/^[A-Za-z0-9 ]+$/.test(key)) {
                    const pattern = new RegExp('\\b' + key + '\\b', 'gi');
                    normalized = normalized.replace(pattern, val);
                } else {
                    normalized = normalized.split(key).join(val);
                }
            }
            return normalized.replace(/\s+/g, "");
        }

        async function fetchScripture(qstr, version = "rcuv") {
            const subQueries = qstr.split('.').map(q => q.trim()).filter(q => q);
            let allRecords = [];
            
            for (let sq of subQueries) {
                const normalizedQ = normalizeQstr(sq);
                const encodedQ = encodeURIComponent(normalizedQ);
                const url = `https://bible.fhl.net/json/qsb.php?version=${version}&qstr=${encodedQ}`;
                
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    if (data.status !== "success") continue;
                    
                    const records = data.record || [];
                    for (let r of records) {
                        allRecords.push({
                            book_short: r.chineses || "",
                            chapter: r.chap,
                            verse: r.sec,
                            text: cleanHtml(r.bible_text || "")
                        });
                    }
                } catch (err) {
                    console.error(err);
                }
            }
            
            if (allRecords.length === 0) {
                throw new Error("找不到符合的經文內容，請檢查引用格式是否正確。");
            }
            
            return allRecords;
        }

        // 經文格式化輸出 (支援簡報貼上與週報複製兩種格式)
        function formatScriptureOutput(recordsZh, recordsTw, mode, formatType) {
            let outputLines = [];
            
            if (formatType === 'slide') {
                if (mode === 'parallel') {
                    if (recordsZh.length !== recordsTw.length) {
                        return "❌ 錯誤：中文與台語譯本節數不對等，無法進行逐節對照！";
                    }
                    
                    for (let i = 0; i < recordsZh.length; i++) {
                        const rZh = recordsZh[i];
                        const rTw = recordsTw[i];
                        const bookFull = BIBLE_SHORT_TO_FULL[rZh.book_short] || rZh.book_short;
                        const header = `${bookFull} ${rZh.chapter}:${rZh.verse}`;
                        
                        let group = [];
                        group.push(header);
                        group.push(`${rZh.verse}. 漢：${rZh.text}`);
                        group.push(`${rTw.verse}. 羅：${rTw.text}`);
                        
                        outputLines.push(group.join('\n'));
                    }
                } else {
                    const records = (mode === 'tghg') ? recordsTw : recordsZh;
                    for (let r of records) {
                        const bookFull = BIBLE_SHORT_TO_FULL[r.book_short] || r.book_short;
                        const header = `${bookFull} ${r.chapter}:${r.verse}`;
                        
                        let group = [];
                        group.push(header);
                        group.push(`${r.verse}. ${r.text}`);
                        
                        outputLines.push(group.join('\n'));
                    }
                }
                return outputLines.join('\n\n');
                
            } else {
                if (mode === 'parallel') {
                    if (recordsZh.length !== recordsTw.length) {
                        return "❌ 錯誤：中文與台語譯本節數不對等，無法進行逐節對照！";
                    }
                    
                    for (let i = 0; i < recordsZh.length; i++) {
                        const rZh = recordsZh[i];
                        const rTw = recordsTw[i];
                        const ref = `${rZh.book_short}${rZh.chapter}:${rZh.verse}`;
                        
                        outputLines.push(`${ref} 漢：${rZh.text}`);
                        outputLines.push(`${ref} 羅：${rTw.text}`);
                    }
                } else {
                    const records = (mode === 'tghg') ? recordsTw : recordsZh;
                    for (let r of records) {
                        const ref = `${r.book_short}${r.chapter}:${r.verse}`;
                        outputLines.push(`${ref} ${r.text}`);
                    }
                }
                return outputLines.join('\n');
            }
        }

        // 點擊抓取並排版經文
        const btnFetch = document.getElementById('btn-fetch-bible');
        const fetchSpinner = document.getElementById('fetch-spinner');
        const fetchBtnText = document.getElementById('fetch-btn-text');

        btnFetch.addEventListener('click', async () => {
            const qstr = document.getElementById('bible-qstr').value.trim();
            if (!qstr) {
                alert("請輸入要查詢的經文！");
                return;
            }

            btnFetch.disabled = true;
            fetchSpinner.style.display = 'block';
            fetchBtnText.textContent = '經文抓取中...';
            previewArea.textContent = "正在聯絡信望愛聖經 API...";

            const mode = document.getElementById('bible-version').value;
            const formatType = document.getElementById('bible-format').value;

            try {
                let recordsZh = [];
                let recordsTw = [];

                if (mode === 'parallel' || mode === 'rcuv') {
                    recordsZh = await fetchScripture(qstr, "rcuv");
                }
                if (mode === 'parallel' || mode === 'tghg') {
                    recordsTw = await fetchScripture(qstr, "tghg");
                }

                const resultText = formatScriptureOutput(recordsZh, recordsTw, mode, formatType);
                previewArea.textContent = resultText;
                currentFormattedResult = resultText;
            } catch (err) {
                alert(`抓取失敗: ${err.message}`);
                previewArea.textContent = `❌ 錯誤: ${err.message}`;
            } finally {
                btnFetch.disabled = false;
                fetchSpinner.style.display = 'none';
                fetchBtnText.textContent = '🚀 抓取並排版經文';
            }
        });

        // 複製排版文字 (共用)
        btnCopy.addEventListener('click', async () => {
            const text = previewArea.textContent;
            if (!text) {
                alert('無排版文字可供複製！');
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                alert('📋 複製成功！');
            } catch (err) {
                alert('複製失敗，請手動全選複製');
            }
        });

        // 下載 UTF-16LE 帶 BOM 的 TXT 檔案 (共用)
        btnDownload.addEventListener('click', () => {
            const text = previewArea.textContent;
            if (!text) {
                alert('無排版文字可供下載！');
                return;
            }

            let title = '排版結果';
            if (currentTab === 'lyrics') {
                const rawText = textarea.value.trim();
                const firstLine = rawText.split('\n')[0].trim();
                if (firstLine && firstLine.length < 30) {
                    title = `${firstLine}_排版後`;
                } else {
                    title = '聖歌隊歌詞_排版後';
                }
            } else {
                const qstr = document.getElementById('bible-qstr').value.trim();
                if (qstr) {
                    title = `經文_${qstr}_排版後`;
                } else {
                    title = '聖經經文_排版後';
                }
            }

            const buffer = new ArrayBuffer(2 + text.length * 2);
            const view = new DataView(buffer);
            view.setUint16(0, 0xFEFF, true);
            
            for (let i = 0; i < text.length; i++) {
                view.setUint16(2 + i * 2, text.charCodeAt(i), true);
            }

            const blob = new Blob([buffer], { type: 'text/plain;charset=utf-16le' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${title}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // ==========================================
        // 🎵 聖詩與啟應文功能區 (Vanilla JS 整合版)
        // ==========================================
        let hymnsInitialized = false;

        async function initHymnsTab() {
            if (hymnsInitialized) return;
            hymnsInitialized = true;
            
            const selectTag = document.getElementById('hymns-select-tag');
            const selectSub = document.getElementById('hymns-select-sub');
            const btnSearch = document.getElementById('hymns-btn-search');
            
            selectTag.addEventListener('change', loadHymnSublist);
            selectSub.addEventListener('change', onSublistSelectChange);
            btnSearch.addEventListener('click', onHymnSearchClick);
            
            // 初次加載新聖詩列表
            await loadHymnSublist();
        }

        async function loadHymnSublist() {
            const selectTag = document.getElementById('hymns-select-tag');
            const selectSub = document.getElementById('hymns-select-sub');
            const container = document.getElementById('hymns-table-container');
            
            container.innerHTML = `<div style="padding:1rem; color:var(--accent);">載入目錄清單中...</div>`;
            selectSub.innerHTML = '';
            
            const tag = selectTag.value;
            const queryParams = {
                sheetUrl: shURL,
                sheetTag: tag,
                key: 0
            };
            
            try {
                const data = await getJsonApi(RSheet2Json_APIV6, queryParams);
                let list = [];
                for (let k in data) {
                    list.push(data[k][0]);
                }
                list.shift(); // 移除首列標頭
                list.sort();
                
                // 填充細項選單
                list.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item.substring(0, 32);
                    selectSub.appendChild(opt);
                });
                
                // 設定 autocomplete
                setupHymnsAutocomplete(document.getElementById('hymns-input-query'), list);
                
                // 設為第一個選項並立刻載入
                if (list.length > 0) {
                    document.getElementById('hymns-input-query').value = list[0];
                    await executeHymnSearch();
                } else {
                    container.innerHTML = `<div style="padding:1rem; color:var(--text-sub);">無目錄資料</div>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="padding:1rem; color:#ef4444;">目錄載入失敗：${err.message}</div>`;
            }
        }

        function onSublistSelectChange() {
            document.getElementById('hymns-input-query').value = document.getElementById('hymns-select-sub').value;
            executeHymnSearch();
        }

        function onHymnSearchClick() {
            const q = document.getElementById('hymns-input-query').value.trim();
            if (!q) {
                alert("請輸入關鍵字再查詢！");
                return;
            }
            executeHymnSearch();
        }

        async function executeHymnSearch() {
            const selectTag = document.getElementById('hymns-select-tag');
            const queryInput = document.getElementById('hymns-input-query');
            const tableContainer = document.getElementById('hymns-table-container');
            const searchBtn = document.getElementById('hymns-btn-search');
            
            let findString = queryInput.value.trim();
            if (findString === '!') findString = '';
            
            searchBtn.disabled = true;
            document.getElementById('hymns-search-text').textContent = '查詢中...';
            tableContainer.innerHTML = `<div style="padding:1rem; color:var(--accent);">連線查詢中，請稍候...</div>`;
            
            const queryParams = {
                sheetUrl: shURL,
                sheetTag: selectTag.value,
                findSting: findString
            };
            
            try {
                const responseText = await getRawApi(Search_API, queryParams);
                if (responseText.length === 2 || !responseText) {
                    tableContainer.innerHTML = `<div style="padding:1rem; color:#ef4444;">查無資料，請重新輸入再查詢</div>`;
                    return;
                }
                
                const data = JSON.parse(responseText);
                if (data.length === 0) {
                    tableContainer.innerHTML = `<div style="padding:1rem; color:var(--text-sub);">查無資料</div>`;
                    return;
                }
                
                // 動態取得所有表頭欄位
                const headers = Object.keys(data[0]);
                
                // 自動播放 YouTube 伴奏
                const ytField = data[0].YT || '';
                if (ytField) {
                    loadYouTubeVideo(ytField);
                }
                
                // 渲染精美 Table HTML
                let html = `<table class="hymns-table"><thead><tr>`;
                headers.forEach(h => {
                    html += `<th>${h}</th>`;
                });
                html += `</tr></thead><tbody>`;
                
                for (let row of data) {
                    if (row[headers[0]].indexOf(findString) >= 0) {
                        html += `<tr>`;
                        headers.forEach(h => {
                            const val = row[h] || '';
                            if (h === headers[0]) {
                                html += `<td><strong>${val}</strong></td>`;
                            } else if (/you|http/gi.test(val)) {
                                let btnClass = 'btn-link-db';
                                let btnText = '投影片';
                                if (h.includes('Drive') || h.includes('雲端')) {
                                    btnClass = 'btn-link-gd';
                                    btnText = '雲端簡報';
                                } else if (h === 'YT' || h === '歌曲伴奏影音') {
                                    btnClass = 'btn-link-yt';
                                    btnText = '伴奏影片';
                                } else if (h === '精簡') {
                                    btnText = '精簡 PDF';
                                }
                                html += `<td><a class="hymns-link-btn ${btnClass}" href="${val}" target="_blank">🔗 ${btnText}</a></td>`;
                            } else {
                                html += `<td>${val}</td>`;
                            }
                        });
                        html += `</tr>`;
                    }
                }
                html += `</tbody></table>`;
                tableContainer.innerHTML = html;
            } catch (err) {
                console.error(err);
                tableContainer.innerHTML = `<div style="padding:1rem; color:#ef4444;">查詢失敗：${err.message}</div>`;
            } finally {
                searchBtn.disabled = false;
                document.getElementById('hymns-search-text').textContent = '🔍 查詢詩歌連結';
            }
        }

        // Autocomplete 自動補全實作
        function setupHymnsAutocomplete(inp, arr) {
            let currentFocus = -1;
            
            // 移除舊的 event listener 以免重複觸發
            const newInp = inp.cloneNode(true);
            inp.parentNode.replaceChild(newInp, inp);
            
            newInp.addEventListener("input", function(e) {
                const val = this.value;
                closeAllLists();
                if (!val) return false;
                currentFocus = -1;
                
                const container = document.createElement("DIV");
                container.setAttribute("id", this.id + "autocomplete-list");
                container.setAttribute("class", "autocomplete-items");
                this.parentNode.appendChild(container);
                
                for (let i = 0; i < arr.length; i++) {
                    const match = arr[i].match(val);
                    if (match) {
                        const start_pos = match.index;
                        const itemDiv = document.createElement("DIV");
                        
                        if (start_pos === 0) {
                            itemDiv.innerHTML = "<strong>" + arr[i].substr(start_pos, val.length) + "</strong>" + arr[i].substr(val.length);
                        } else {
                            itemDiv.innerHTML = arr[i].substr(0, start_pos) + "<strong>" + arr[i].substr(start_pos, val.length) + "</strong>" + arr[i].substr(start_pos + val.length);
                        }
                        
                        itemDiv.innerHTML += "<input type='hidden' value='" + arr[i] + "'>";
                        itemDiv.addEventListener("click", function(e) {
                            newInp.value = this.getElementsByTagName("input")[0].value;
                            closeAllLists();
                            executeHymnSearch();
                        });
                        container.appendChild(itemDiv);
                    }
                }
            });
            
            newInp.addEventListener("keydown", function(e) {
                let x = document.getElementById(this.id + "autocomplete-list");
                if (x) x = x.getElementsByTagName("div");
                if (e.keyCode === 40) { // 下
                    currentFocus++;
                    addActive(x);
                } else if (e.keyCode === 38) { // 上
                    currentFocus--;
                    addActive(x);
                } else if (e.keyCode === 13) { // Enter
                    e.preventDefault();
                    if (currentFocus > -1 && x) {
                        x[currentFocus].click();
                    }
                }
            });
            
            function addActive(x) {
                if (!x) return false;
                removeActive(x);
                if (currentFocus >= x.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = x.length - 1;
                x[currentFocus].classList.add("autocomplete-active");
            }
            
            function removeActive(x) {
                for (let i = 0; i < x.length; i++) {
                    x[i].classList.remove("autocomplete-active");
                }
            }
            
            function closeAllLists(elmnt) {
                const x = document.getElementsByClassName("autocomplete-items");
                for (let i = 0; i < x.length; i++) {
                    if (elmnt !== x[i] && elmnt !== newInp) {
                        x[i].parentNode.removeChild(x[i]);
                    }
                }
            }
            
            document.addEventListener("click", (e) => {
                closeAllLists(e.target);
            });
        }

        // YouTube 影片 ID 解析與播放器加載
        function extractYoutubeId(url) {
            const match = url.split(/(vi\/|v=|\/v\/|youtu\.be\/|\/embed\/)/);
            return match[2] !== undefined ? match[2].split(/[^0-9a-z_\-]/i)[0] : url;
        }

        function loadYouTubeVideo(url) {
            const videoId = extractYoutubeId(url);
            
            if (ytPlayer) {
                try {
                    ytPlayer.loadVideoById({ videoId: videoId });
                } catch (e) {
                    console.error("YouTube Player error:", e);
                }
            } else {
                // 初始化 Player API
                ytPlayer = new YT.Player("youtube-player", {
                    height: "100%",
                    width: "100%",
                    videoId: videoId,
                    playerVars: {
                        autoplay: 0,
                        loop: 1,
                        playlist: videoId
                    },
                    events: {
                        onStateChange: onPlayerStateChange
                    }
                });
            }
        }

        // 隨機或循序自動播放下一首邏輯
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                console.log("[YTPlayer] 影片播放結束，準備切換播放下一首。");
                const selectSub = document.getElementById('hymns-select-sub');
                const playMode = document.getElementById('hymns-play-mode').value;
                
                if (selectSub.options.length === 0) return;
                
                if (playMode === 'random') {
                    // 隨機播放模式
                    const randomIndex = Math.floor(Math.random() * selectSub.options.length);
                    selectSub.selectedIndex = randomIndex;
                } else {
                    // 循序播放模式
                    if (selectSub.selectedIndex < selectSub.options.length - 1) {
                        selectSub.selectedIndex++;
                    } else {
                        // 播放到最後一首，重頭開始
                        selectSub.selectedIndex = 0;
                    }
                }
                
                document.getElementById('hymns-input-query').value = selectSub.value;
                executeHymnSearch().then(() => {
                    if (ytPlayer) {
                        // 載入完成後自動播放
                        setTimeout(() => {
                            try { ytPlayer.playVideo(); } catch(e){}
                        }, 500);
                    }
                });
            }
        }

        // API 輔助函式
        async function getJsonApi(urlptr, para) {
            const url = new URL(urlptr);
            for (let k in para) {
                url.searchParams.append(k, para[k]);
            }
            const response = await fetch(url);
            return response.json();
        }

        async function getRawApi(urlptr, para) {
            const url = new URL(urlptr);
            for (let k in para) {
                url.searchParams.append(k, para[k]);
            }
            const response = await fetch(url);
            return response.text();
        }
    </script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖歌隊字幕 PPTX 產生器</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- PptxGenJS CDN -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    
    <style>
        :root {
            --bg-start: #0f0c20;
            --bg-end: #15102a;
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary-glow: linear-gradient(135deg, #7b2ff7 0%, #1185f0 100%);
            --button-hover: linear-gradient(135deg, #8d46f9 0%, #3095f2 100%);
            --text-main: #f3f1f7;
            --text-sub: #a49eb5;
            --accent: #1185f0;
            --accent-glow: rgba(17, 133, 240, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: #7b2ff7;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: #1185f0;
            bottom: -150px;
            right: -150px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--text-sub) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        .form-group {
            margin-bottom: 1.8rem;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .drop-zone {
            border: 2px dashed var(--panel-border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(17, 133, 240, 0.05);
        }

        .drop-zone p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .drop-zone-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .control-item {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-label {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .control-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .control-desc {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
            border: 1px solid var(--panel-border);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--primary-glow);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .number-input {
            width: 70px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 8px;
            text-align: center;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .number-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-glow);
            border: none;
            padding: 1.1rem;
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            box-shadow: 0 4px 20px rgba(123, 47, 247, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            background: var(--button-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(123, 47, 247, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <div class="container">
        <header>
            <h1>聖歌隊字幕 PPTX 產生器</h1>
            <p class="subtitle">將歌詞純文字一鍵轉為 16:9 主日專用簡報</p>
        </header>

        <main>
            <div class="drop-zone" id="drop-zone">
                <div class="drop-zone-icon">📄</div>
                <p>將歌詞文字檔 (.txt) 拖曳到此處，或<strong>點擊選擇檔案</strong></p>
                <input type="file" id="file-input" accept=".txt" style="display: none;">
            </div>

            <div class="form-group">
                <label for="lyrics-textarea">歌詞文字與介紹資訊</label>
                <textarea id="lyrics-textarea" placeholder="請在此貼上歌詞內容。&#10;如果啟用了「自動解析介紹」，前 5 行應為：歌名、團體、日期、指揮、司琴。"></textarea>
            </div>

            <div class="controls-grid">
                <div class="control-item">
                    <div class="control-label">
                        <span class="control-title">自動解析介紹</span>
                        <span class="control-desc">自動辨識前5行與詞曲作者</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="auto-header" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                
                <div class="control-item">
                    <div class="control-label">
                        <span class="control-title">產生封面投影片</span>
                        <span class="control-desc">加入十字架主標題封面</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="generate-cover" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-item">
                    <div class="control-label">
                        <span class="control-title">產生介紹投影片</span>
                        <span class="control-desc">加入歌名、團體、指揮等簡介</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="generate-intro" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-item">
                    <div class="control-label">
                        <span class="control-title">單行字數限制</span>
                        <span class="control-desc">超長行會自動分行</span>
                    </div>
                    <input type="number" id="max-len" class="number-input" value="15" min="5" max="30">
                </div>
            </div>

            <button class="btn-submit" id="btn-generate">
                <div class="spinner" id="btn-spinner"></div>
                <span id="btn-text">🚀 產生並下載簡報</span>
            </button>
        </main>
    </div>

    <footer>
        <p>南門教會聖歌隊專屬自動化工具 • Antigravity 2.0 Web Service</p>
    </footer>

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const textarea = document.getElementById('lyrics-textarea');
        const btnGenerate = document.getElementById('btn-generate');
        const btnSpinner = document.getElementById('btn-spinner');

        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        dropZone.addEventListener('dragover', (e) => {

            dropZone.addEventListener(eventName, () => {

        function handleFile(file) {
            if (!file || !file.name.endsWith('.txt')) {
                alert('請上傳純文字檔 (.txt)');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                textarea.value = e.target.result;
            };
            reader.readAsText(file);
        }

        // 語意超長分行演算法
        function splitLongLine(line, maxLen = 15) {
            line = line.trim();
            if (line.length <= maxLen) {
                return [line];
            }
            
            const delimiters = [
                /[，,；;！!？?。.]/,
                /[\s　]/
            ];
            
            let bestSplitIdx = -1;
            let minDistToCenter = line.length;
            const center = line.length / 2;
            
            for (let pattern of delimiters) {
                let match;
                // 模擬 re.finditer
                const regex = new RegExp(pattern, 'g');
                while ((match = regex.exec(line)) !== null) {
                    const idx = match.index + match[0].length; // 切在後方
                    const dist = Math.abs(idx - center);
                    if (dist < minDistToCenter) {
                        minDistToCenter = dist;
                        bestSplitIdx = idx;
                    }
                }
                if (bestSplitIdx !== -1) break;
            }
            
            if (bestSplitIdx === -1 || bestSplitIdx === 0 || bestSplitIdx === line.length) {
                bestSplitIdx = Math.floor(center);
            }
            
            const left = line.substring(0, bestSplitIdx).trim();
            const right = line.substring(bestSplitIdx).trim();
            
            return splitLongLine(left, maxLen).concat(splitLongLine(right, maxLen));
        }

        // 歌詞自動切分頁面
        function chunkRawLyrics(text, linesPerPage = 2, maxLen = 15) {
            const rawLines = text.split('\n').map(l => l.trim()).filter(l => l);
            const processedLines = [];
            for (let line of rawLines) {
                processedLines.push(...splitLongLine(line, maxLen));
            }
            
            const pages = [];
            let pageIdx = 1;
            for (let i = 0; i < processedLines.length; i += linesPerPage) {
                pages.push({
                    page: `P${pageIdx}`,
                    lines: processedLines.slice(i, i + linesPerPage)
                });
                pageIdx++;
            }
            return pages;
        }

        // 自動解析 Header 與作者
        function parseAutoHeaderFile(content) {
            const lines = content.split('\n').map(l => l.trim()).filter(l => l);
            const metadata = {};
            const lyricsLines = [];
            
            if (lines.length >= 1) metadata.title = lines[0];
            if (lines.length >= 2) metadata.group = lines[1];
            if (lines.length >= 3) metadata.date = lines[2];
            if (lines.length >= 4) metadata.conductor_line = lines[3];
            if (lines.length >= 5) metadata.accompanist_line = lines[4];
            
            let inHeader = true;
            for (let i = 5; i < lines.length; i++) {
                const line = lines[i];
                if (inHeader) {
                    let isIntro = false;
                    if (line === metadata.title) {
                        isIntro = true;
                    } else if (/(words by|music_by|music by|詞曲|台語|翻譯|譯詞|指揮|司琴|伴奏|配器|arr\.|arranged by)/i.test(line)) {
                        isIntro = true;
                        if (/words\s+by/i.test(line)) {
                            metadata.words_by = line.replace(/words\s+by\s*/i, '').trim();
                        } else if (/music\s+by/i.test(line)) {
                            metadata.music_by = line.replace(/music\s+by\s*/i, '').trim();
                        } else if (/詞曲/.test(line)) {
                            metadata.composer = line.replace(/^詞曲\s*/, '').trim();
                        } else if (/台語/.test(line)) {
                            metadata.translator = line.replace(/^台語\s*/, '').trim();
                        }
                    }
                    
                    if (isIntro) continue;
                    else inHeader = false;
                }
                lyricsLines.push(line);
            }
            
            return {
                metadata: metadata,
                lyricsText: lyricsLines.join('\n')
            };
        }

        // 產生簡報核心邏輯 (純前端)
        btnGenerate.addEventListener('click', async () => {
            const lyricsText = textarea.value.trim();
            if (!lyricsText) {
                alert('請先輸入或上傳歌詞！');
                return;
            }

            btnGenerate.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.textContent = '簡報產生中...';

            // 確保 PptxGenJS 已載入
            if (typeof PptxGenJS === 'undefined' && typeof pptxgen === 'undefined') {
                alert('PptxGenJS 程式庫載入失敗，請檢查網路連線！');
                btnGenerate.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = '🚀 產生並下載簡報';
                return;
            }

            try {
                // 初始化簡報
                let pptx = new pptxgen();
                pptx.layout = 'LAYOUT_16x9';

                const autoHeader = document.getElementById('auto-header').checked;
                const generateCover = document.getElementById('generate-cover').checked;
                const generateIntro = document.getElementById('generate-intro').checked;
                const maxLen = parseInt(document.getElementById('max-len').value, 10) || 15;

                let metadata = {};
                let lyricsPages = [];

                if (autoHeader) {
                    const parsed = parseAutoHeaderFile(lyricsText);
                    metadata = parsed.metadata;
                    lyricsPages = chunkRawLyrics(parsed.lyricsText, 2, maxLen);
                } else {
                    metadata = { title: lyricsText.split('\n')[0].trim() || '詩歌字幕' };
                    lyricsPages = chunkRawLyrics(lyricsText, 2, maxLen);
                }

                // 1. 產生封面頁
                if (generateCover) {
                    let slide = pptx.addSlide();
                    
                    // 畫白色背景與十字架 (image2.png)
                    slide.addImage({ 
                        data: 'image/png;base64,' + IMAGE_LOGO_BASE64, 
                        x: 0.23, 
                        y: 0.28, 
                        w: 1.15, 
                        h: 5.06 
                    });
                    
                    // 右側封面文字 (讚美 / 歌名 / 聖歌隊)
                    const titleText = metadata.title || '詩歌名稱';
                    slide.addText(
                        [
                            { text: '讚美\n\n', options: { color: 'C00000', fontSize: 32, fontFace: '標楷體', bold: true } },
                            { text: titleText + '\n\n', options: { color: '002060', fontSize: 44, fontFace: '標楷體', bold: true } },
                            { text: '聖歌隊', options: { color: '002060', fontSize: 28, fontFace: '標楷體', bold: true } }
                        ],
                        { 
                            x: 1.8, 
                            y: 1.0, 
                            w: 7.8, 
                            h: 3.6, 
                            align: 'center', 
                            valign: 'middle' 
                        }
                    );
                }

                // 2. 產生介紹頁
                const hasComposer = metadata.composer || metadata.translator || metadata.words_by || metadata.music_by;
                const totalPages = hasComposer ? 4 : 3;

                if (generateIntro) {
                    let pageIdx = 1;

                    // 介紹頁 1: 歌名
                    {
                        let slide = pptx.addSlide();
                        slide.background = { data: 'image/png;base64,' + IMAGE_BG_BASE64 };
                        slide.addText(`P0-${pageIdx}/${totalPages}`, { x: 0.5, y: 0.2, w: 9.0, h: 0.5, fontSize: 16, color: '808080', align: 'center', fontFace: 'Calibri' });
                        slide.addText(metadata.title || '', { x: 0.5, y: 1.5, w: 9.0, h: 3.0, fontSize: 40, color: '002060', align: 'center', fontFace: '標楷體', bold: true });
                        pageIdx++;
                    }

                    // 介紹頁 2: 詞曲與台語 (若有)
                    if (hasComposer) {
                        let slide = pptx.addSlide();
                        slide.background = { data: 'image/png;base64,' + IMAGE_BG_BASE64 };
                        slide.addText(`P0-${pageIdx}/${totalPages}`, { x: 0.5, y: 0.2, w: 9.0, h: 0.5, fontSize: 16, color: '808080', align: 'center', fontFace: 'Calibri' });
                        
                        let lines = [];
                        if (metadata.words_by) lines.push(`Words by ${metadata.words_by}`);
                        if (metadata.music_by) lines.push(`Music by ${metadata.music_by}`);
                        if (metadata.composer) lines.push(`詞曲 ${metadata.composer}`);
                        if (metadata.translator) lines.push(`台語 ${metadata.translator}`);
                        
                        slide.addText(lines.join('\n'), { x: 0.5, y: 1.5, w: 9.0, h: 3.0, fontSize: 36, color: '002060', align: 'center', fontFace: '標楷體', bold: true });
                        pageIdx++;
                    }

                    // 介紹頁 3: 團體與日期
                    {
                        let slide = pptx.addSlide();
                        slide.background = { data: 'image/png;base64,' + IMAGE_BG_BASE64 };
                        slide.addText(`P0-${pageIdx}/${totalPages}`, { x: 0.5, y: 0.2, w: 9.0, h: 0.5, fontSize: 16, color: '808080', align: 'center', fontFace: 'Calibri' });
                        
                        let group = metadata.group || '台北南門教會聖歌隊';
                        let date = metadata.date || '';
                        slide.addText(`${group}\n${date}`.trim(), { x: 0.5, y: 1.5, w: 9.0, h: 3.0, fontSize: 36, color: '002060', align: 'center', fontFace: '標楷體', bold: true });
                        pageIdx++;
                    }

                    // 介紹頁 4: 指揮與伴奏
                    {
                        let slide = pptx.addSlide();
                        slide.background = { data: 'image/png;base64,' + IMAGE_BG_BASE64 };
                        slide.addText(`P0-${pageIdx}/${totalPages}`, { x: 0.5, y: 0.2, w: 9.0, h: 0.5, fontSize: 16, color: '808080', align: 'center', fontFace: 'Calibri' });
                        
                        let cond = metadata.conductor_line || '指揮：';
                        let acc = metadata.accompanist_line || '司琴：';
                        slide.addText(`${cond}\n${acc}`.trim(), { x: 0.5, y: 1.5, w: 9.0, h: 3.0, fontSize: 36, color: '002060', align: 'center', fontFace: '標楷體', bold: true });
                    }
                }

                // 3. 產生歌詞頁
                lyricsPages.forEach(page => {
                    let slide = pptx.addSlide();
                    slide.background = { data: 'image/png;base64,' + IMAGE_BG_BASE64 };
                    slide.addText(page.page, { x: 0.5, y: 0.2, w: 9.0, h: 0.5, fontSize: 16, color: '808080', align: 'center', fontFace: 'Calibri' });
                    slide.addText(page.lines.join('\n'), { x: 0.5, y: 1.5, w: 9.0, h: 3.0, fontSize: 40, color: '002060', align: 'center', fontFace: '標楷體', bold: true });
                });

                // 匯出下載簡報
                const finalFilename = `${metadata.title || '聖歌隊字幕'}.pptx`;
                pptx.writeFile({ fileName: finalFilename });

            } catch (err) {
                alert(`產生簡報失敗: ${err.message}`);
                console.error(err);
            } finally {
                btnGenerate.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = '🚀 產生並下載簡報';
            }
        });
    </script>
</body>
</html>
